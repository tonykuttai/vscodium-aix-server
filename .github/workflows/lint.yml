name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: bash -n
        run: |
          set -e
          for f in bin/vsx lib/*.sh modules/*.sh cron/*.sh templates/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          shellcheck -S warning -x bin/vsx lib/*.sh modules/*.sh cron/*.sh
          # Templates are POSIX sh and sourced with $ROOT set by the caller.
          shellcheck -S warning -s sh -e SC2148,SC2154 templates/*.sh
      - name: templates render
        run: |
          python3 - <<'PY'
          import re, pathlib
          for p in pathlib.Path("templates").glob("*.sh"):
              text = p.read_text()
              print(p, sorted(set(re.findall(r"@([A-Z_]+)@", text))))
          PY
