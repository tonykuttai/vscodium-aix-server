name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: bash -n
        run: |
          set -e
          for f in bin/vsx lib/*.sh cron/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          shellcheck -S warning -x bin/vsx lib/*.sh cron/*.sh
          # Templates are POSIX sh and sourced with $ROOT set by the caller.